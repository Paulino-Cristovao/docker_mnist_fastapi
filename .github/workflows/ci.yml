name: CI-fastapi-docker

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Run ruff
        run: ruff check app --fix --exit-non-zero-on-fix
      - name: Run pylint
        run: |
          cd app
          pylint *.py
  
  docker:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t mnist-fastapi:latest .
      - name: Test Docker image
        run: |
          docker run --rm -d -p 8000:8000 --name test-container mnist-fastapi:latest
          sleep 10
          curl -f http://localhost:8000 || exit 1
          docker stop test-container
